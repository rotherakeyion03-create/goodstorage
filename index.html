<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌾 谷子仓库 - 温馨管理你的宝贝</title>
    <style>
        :root {
            --bg: #FFF8EC;
            --card-bg: #FFFDF7;
            --warm-cream: #FFF3D6;
            --warm-beige: #F5E6CC;
            --text: #5D4E37;
            --text-light: #8B7355;
            --accent: #E8C97A;
            --accent-hover: #D4A94E;
            --danger: #E07B6C;
            --success: #7BA87F;
            --border: #E8D5B7;
            --shadow: 0 2px 12px rgba(139,115,85,0.1);
            --radius: 14px;
            --font: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
        .navbar{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);flex-wrap:wrap}
        .logo{font-size:1.4em;font-weight:700;cursor:pointer}
        .nav-tabs{display:flex;gap:4px;background:var(--warm-cream);border-radius:24px;padding:4px}
        .nav-tab{padding:8px 18px;border-radius:20px;cursor:pointer;font-weight:600;border:none;background:transparent;color:var(--text-light)}
        .nav-tab.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.08)}
        .btn{padding:9px 16px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:0.88em;display:inline-flex;align-items:center;gap:5px}
        .btn-primary{background:var(--accent);color:#5D4E37}
        .btn-outline{background:transparent;border:2px solid var(--border);color:var(--text-light)}
        .btn-sm{padding:5px 12px;font-size:0.78em;border-radius:14px}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-success{background:var(--success);color:#fff}
        .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:0.75em;font-weight:600}
        .badge-warning{background:#FFF0D0;color:#B8860B}
        .badge-info{background:#E5F0F9;color:#2E6B9E}
        .badge-success{background:#E8F5E9;color:#2E7D32}
        .badge-drop{background:#F5F5F5;color:#999;text-decoration:line-through}

        .main-container{display:flex;max-width:1500px;margin:0 auto;padding:16px}
        .sidebar{width:280px;flex-shrink:0;background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);position:sticky;top:76px;max-height:calc(100vh - 100px);overflow-y:auto;border:1px solid var(--border)}
        .content-area{flex:1;margin-left:16px}
        .filter-group{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
        .filter-chip{padding:5px 11px;border-radius:15px;cursor:pointer;font-size:0.78em;background:var(--warm-cream);border:1px solid transparent;user-select:none;color:var(--text-light)}
        .filter-chip.active{background:var(--accent);color:#5D4E37;font-weight:600}
        .waterfall{column-count:4;column-gap:14px}
        @media(max-width:1300px){.waterfall{column-count:3}}
        @media(max-width:960px){.waterfall{column-count:2}}
        @media(max-width:700px){.waterfall{column-count:1}.main-container{flex-direction:column}.sidebar{width:100%;position:static;margin-bottom:12px}.content-area{margin-left:0}}
        .guzi-card{break-inside:avoid;margin-bottom:14px;background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);transition:0.2s;cursor:pointer}
        .guzi-card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,115,85,0.16)}
        .guzi-card.drop{opacity:0.5;border-style:dashed}
        .card-header{display:flex;justify-content:space-between;margin-bottom:8px}
        .card-cn{font-weight:700;font-size:0.9em}
        .card-ip{background:#FFF8EC;padding:2px 8px;border-radius:10px;font-size:0.78em;color:#8B7355}
        .card-footer{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:0.75em;color:var(--text-light)}

        .modal-overlay{position:fixed;inset:0;background:rgba(80,60,40,0.45);z-index:200;display:flex;align-items:center;justify-content:center}
        .modal{background:var(--card-bg);border-radius:var(--radius);padding:24px;width:90%;max-width:620px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
        .modal h3{margin-bottom:16px}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .full-width{grid-column:1/-1}
        label{display:block;font-size:0.82em;font-weight:600;margin-bottom:3px;color:var(--text-light)}
        input,select,textarea{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);font-family:var(--font);font-size:0.88em}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:24px;font-weight:600;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.18)}
        .toast-success{background:#E8F5E9;color:#2E7D32}
        .toast-error{background:#FDE8E5;color:#C0392B}

        .ai-panel{position:fixed;bottom:20px;right:20px;width:380px;background:var(--card-bg);border-radius:var(--radius);box-shadow:0 12px 40px rgba(0,0,0,0.2);z-index:150;display:flex;flex-direction:column;border:1px solid var(--border)}
        .ai-panel.collapsed{max-height:44px;overflow:hidden}
        .ai-header{padding:10px 14px;cursor:pointer;font-weight:700;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
        .ai-messages{flex:1;overflow-y:auto;padding:10px;font-size:0.82em;min-height:120px;max-height:300px}
        .ai-input-row{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
        .ai-msg{margin:4px 0;padding:8px 12px;border-radius:14px;max-width:85%}
        .ai-msg.user{background:var(--warm-cream);margin-left:auto}
        .ai-msg.bot{background:#fff;margin-right:auto;border:1px solid var(--border)}
    </style>
</head>
<body>
<nav class="navbar">
    <div class="logo" onclick="location.reload()">🌾 <span>谷子仓库</span></div>
    <div class="nav-tabs">
        <button class="nav-tab active" data-mode="personal" onclick="switchMode('personal')">🏠 个人版</button>
        <button class="nav-tab" data-mode="group" onclick="switchMode('group')">👥 开团版</button>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="toggleAI()">🤖 AI导入</button>
        <button class="btn btn-outline btn-sm" onclick="$('excelInput').click()">📊 Excel</button>
        <button class="btn btn-outline btn-sm" onclick="$('imgInput').click()">📷 图片</button>
        <button class="btn btn-primary" onclick="openGuziModal()">+ 添加谷子</button>
        <span id="groupBadge" style="display:none;font-size:0.85em;color:var(--text-light)"></span>
        <span id="userInfo" style="font-size:0.82em"></span>
        <button class="btn btn-outline btn-sm" id="btnLogin" onclick="openLogin()">🔑 登录</button>
        <button class="btn btn-outline btn-sm" id="btnLogout" style="display:none" onclick="logout()">退出</button>
        <button class="btn btn-outline btn-sm" id="btnManage" style="display:none" onclick="openManage()">⚙️ 管理</button>
        <button class="btn btn-outline btn-sm" id="btnMsg" style="display:none" onclick="openMsg()">💬 留言</button>
    </div>
</nav>

<div class="main-container">
    <aside class="sidebar">
        <h4>🔍 搜索</h4>
        <input type="text" id="searchInput" placeholder="搜索..." oninput="applyFilters()">
        <h4>📂 展示</h4>
        <select id="displayMode" onchange="applyFilters()">
            <option value="all">共同展示</option>
            <option value="by-ip">按IP</option>
            <option value="by-type">按种类</option>
        </select>
        <h4>📋 IP</h4>
        <div class="filter-group" id="ipFilters"></div>
        <h4>🎭 角色</h4>
        <div class="filter-group" id="charFilters"></div>
        <h4>🏷️ 种类</h4>
        <div class="filter-group" id="typeFilters"></div>
        <h4>📌 状态</h4>
        <div class="filter-group" id="statusFilters">
            <span class="filter-chip active" data-status="all" onclick="setStatus('all',this)">全部</span>
            <span class="filter-chip" data-status="正常" onclick="setStatus('正常',this)">正常</span>
            <span class="filter-chip" data-status="待交肾" onclick="setStatus('待交肾',this)">待交肾</span>
            <span class="filter-chip" data-status="掉落" onclick="setStatus('掉落',this)">⚠️掉落</span>
        </div>
        <h4>📊 统计</h4>
        <div id="stats"></div>
        <button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="clearFilters()">🔄 清除筛选</button>
    </aside>
    <div class="content-area">
        <div id="waterfall" class="waterfall"></div>
        <div id="empty" style="display:none;text-align:center;padding:60px;color:var(--text-light)">📭 还没有谷子~</div>
    </div>
</div>

<div class="ai-panel collapsed" id="aiPanel">
    <div class="ai-header" onclick="toggleAI()">🤖 AI导入助手 <span id="aiIcon">▲</span></div>
    <div class="ai-messages" id="aiMsgs"><div class="ai-msg bot">你好！描述谷子信息，如"CN小明 原神 钟离 吧唧 2个 45元"</div></div>
    <div class="ai-input-row">
        <input id="aiInput" placeholder="描述谷子..." onkeydown="if(event.key==='Enter')sendAI()">
        <button class="btn btn-primary btn-sm" onclick="sendAI()">发送</button>
    </div>
</div>

<input type="file" id="excelInput" accept=".csv,.xlsx" hidden onchange="handleExcel(event)">
<input type="file" id="imgInput" accept="image/*" hidden onchange="handleImage(event)">
<div id="modalContainer"></div>
<div id="toastContainer"></div>

<script>
// ==================== 全局配置 ====================
const API = 'https://goostorey.onrender.com/api';
const STATE = {
    mode: 'personal',
    user: null,
    groupId: null,
    groups: [],
    list: [],
    personal: JSON.parse(localStorage.getItem('guzi_personal')||'[]'),
    filters: {search:'',ip:'all',char:'all',type:'all',status:'all',display:'all'},
    aiPending: null
};

function $(id){return document.getElementById(id)}
function toast(msg,ok=true){const d=document.createElement('div');d.className=`toast ${ok?'toast-success':'toast-error'}`;d.textContent=msg;$('toastContainer').appendChild(d);setTimeout(()=>d.remove(),2500)}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`}
function daysBetween(d1,d2){return Math.floor((new Date(d2)-new Date(d1))/86400000)}
function firstOfMonth(d){const dt=new Date(d);return new Date(dt.getFullYear(),dt.getMonth(),1)}

// ==================== API 调用 ====================
async function api(path,method='GET',body=null){
    const headers={'Content-Type':'application/json'};
    const token=localStorage.getItem('token');
    if(token)headers['Authorization']='Bearer '+token;
    const res=await fetch(API+path,{method,headers,body:body?JSON.stringify(body):null});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||'请求失败');
    return data;
}

// ==================== 认证相关 ====================
async function login(qq,cn){
    const data=await api('/auth/login','POST',{qq,cn});
    localStorage.setItem('token',data.token);
    STATE.user=data.user;
    await loadGroups();
    updateUI();
}
async function loadGroups(){
    const data=await api('/groups');
    STATE.groups=data.groups||[];
}
function logout(){
    localStorage.removeItem('token');
    STATE.user=null; STATE.groupId=null; STATE.list=[];
    updateUI(); switchMode('personal');
    toast('已退出');
}
async function loadGroupGuzi(){
    if(!STATE.groupId)return;
    try{
        const data=await api(`/groups/${STATE.groupId}/guzi`);
        STATE.list=data.guzi||[];
    }catch(e){STATE.list=[]}
}

// ==================== 模式切换 ====================
function switchMode(mode){
    STATE.mode=mode;
    document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
    if(mode==='personal'){
        STATE.groupId=null;
        STATE.list=[...STATE.personal];
    }else{
        if(!STATE.user){openLogin();return}
        if(STATE.groupId)loadGroupGuzi().then(()=>{applyFilters();updateStats()});
    }
    applyFilters();updateStats();updateChips();
}

// ==================== UI 更新 ====================
function updateUI(){
    if(STATE.user){
        $('btnLogin').style.display='none';$('btnLogout').style.display='';
        $('btnMsg').style.display='';
        $('userInfo').textContent=`👤 ${STATE.user.cn}`;
        if(STATE.user.role==='leader'||STATE.user.role==='admin')$('btnManage').style.display='';
        else $('btnManage').style.display='none';
        if(STATE.groupId){
            const g=STATE.groups.find(gr=>gr.id==STATE.groupId);
            $('groupBadge').style.display='';$('groupBadge').textContent=g?`📦 ${g.name}`:'';
        }
    }else{
        $('btnLogin').style.display='';$('btnLogout').style.display='none';
        $('btnManage').style.display='none';$('btnMsg').style.display='none';
        $('userInfo').textContent='';$('groupBadge').style.display='none';
    }
}

// ==================== 弹窗系统 ====================
function openLogin(){
    const html=`
    <div class="modal-overlay" id="loginOverlay"><div class="modal" style="max-width:400px">
    <h3>🔑 登录开团版</h3>
    <div><label>QQ号（账号）</label><input id="loginQQ" placeholder="QQ号"></div>
    <div><label>圈名 / CN（昵称）</label><input id="loginCN" placeholder="例如：小明"></div>
    <div><label>选择团</label><select id="loginGroup"><option value="">--选择团--</option></select></div>
    <button class="btn btn-primary" onclick="doLogin()">登录</button>
    <button class="btn btn-outline btn-sm" onclick="createGroupModal()">+ 创建新团</button>
    <button class="btn btn-outline btn-sm" onclick="closeModal('loginOverlay')">取消</button>
    </div></div>`;
    $('modalContainer').innerHTML=html;
    loadGroups().then(()=>{
        const sel=$('loginGroup');
        sel.innerHTML='<option value="">--选择团--</option>'+STATE.groups.map(g=>`<option value="${g.id}">${g.name}</option>`).join('');
    });
}
async function doLogin(){
    const qq=$('loginQQ')?.value.trim(),cn=$('loginCN')?.value.trim(),gid=$('loginGroup')?.value;
    if(!qq||!cn||!gid)return toast('请填写完整',false);
    try{
        await login(qq,cn);
        STATE.groupId=parseInt(gid);
        await loadGroupGuzi();
        updateUI();
        switchMode('group');
        closeModal('loginOverlay');
        toast('登录成功');
    }catch(e){toast(e.message,false)}
}
function createGroupModal(){
    $('modalContainer').innerHTML=`
    <div class="modal-overlay" id="createOverlay"><div class="modal" style="max-width:400px">
    <h3>🌟 创建新团</h3>
    <div><label>团名称</label><input id="newName" placeholder="例如：原神谷子团"></div>
    <div><label>您的QQ号</label><input id="newQQ"></div>
    <div><label>您的圈名/CN</label><input id="newCN"></div>
    <button class="btn btn-primary" onclick="doCreateGroup()">创建</button>
    <button class="btn btn-outline btn-sm" onclick="closeModal('createOverlay')">取消</button>
    </div></div>`;
}
async function doCreateGroup(){
    const name=$('newName')?.value.trim(),qq=$('newQQ')?.value.trim(),cn=$('newCN')?.value.trim();
    if(!name||!qq||!cn)return toast('请填写完整',false);
    try{
        await login(qq,cn); // 先登录
        const data=await api('/groups','POST',{name});
        STATE.groupId=data.group.id;
        await loadGroups();
        await loadGroupGuzi();
        updateUI();
        switchMode('group');
        closeModal('createOverlay');
        if($('loginOverlay'))closeModal('loginOverlay');
        toast('团创建成功！');
    }catch(e){toast(e.message,false)}
}

function openManage(){
    $('modalContainer').innerHTML=`
    <div class="modal-overlay" id="manageOverlay"><div class="modal" style="max-width:500px">
    <h3>⚙️ 管理团</h3>
    <div><label>添加管理员</label><div style="display:flex;gap:6px"><input id="adminQQ" placeholder="QQ"><input id="adminCN" placeholder="圈名"><button class="btn btn-primary btn-sm" onclick="addAdmin()">添加</button></div></div>
    <div style="margin-top:8px"><label>添加团员</label><div style="display:flex;gap:6px"><input id="memberQQ" placeholder="QQ"><input id="memberCN" placeholder="圈名"><button class="btn btn-primary btn-sm" onclick="addMember()">添加</button></div></div>
    <div style="margin-top:8px"><label>转移团长</label><div style="display:flex;gap:6px"><input id="transferQQ" placeholder="新团长QQ"><button class="btn btn-danger btn-sm" onclick="transferLeader()">转移</button></div></div>
    <div style="margin-top:8px"><button class="btn btn-outline btn-sm" onclick="viewMsgs()">查看留言</button><div id="msgsDisplay" style="max-height:200px;overflow-y:auto;font-size:0.82em"></div></div>
    <button class="btn btn-outline btn-sm" onclick="closeModal('manageOverlay')">关闭</button>
    </div></div>`;
}
async function addAdmin(){
    try{await api(`/groups/${STATE.groupId}/admins`,'POST',{qq:$('adminQQ').value,cn:$('adminCN').value});toast('已添加')}catch(e){toast(e.message,false)}
}
async function addMember(){
    try{await api(`/groups/${STATE.groupId}/members`,'POST',{qq:$('memberQQ').value,cn:$('memberCN').value});toast('已添加')}catch(e){toast(e.message,false)}
}
async function transferLeader(){
    try{await api(`/groups/${STATE.groupId}/transfer`,'POST',{newLeaderQq:$('transferQQ').value});toast('已转移');closeModal('manageOverlay');logout()}catch(e){toast(e.message,false)}
}
async function viewMsgs(){
    try{const data=await api(`/groups/${STATE.groupId}/messages`);$('msgsDisplay').innerHTML=data.messages.map(m=>`<div style="padding:4px;border-bottom:1px solid #eee"><b>${m.sender_cn}</b>: ${m.content}</div>`).join('')||'暂无留言'}catch(e){toast('加载失败',false)}
}
function openMsg(){
    $('modalContainer').innerHTML=`
    <div class="modal-overlay" id="msgOverlay"><div class="modal" style="max-width:400px"><h3>💬 留言</h3><textarea id="msgContent" rows="4"></textarea><div style="margin-top:8px"><button class="btn btn-primary" onclick="sendMsg()">发送</button><button class="btn btn-outline btn-sm" onclick="closeModal('msgOverlay')">取消</button></div></div></div>`;
}
async function sendMsg(){
    try{await api(`/groups/${STATE.groupId}/messages`,'POST',{content:$('msgContent').value});toast('已发送');closeModal('msgOverlay')}catch(e){toast(e.message,false)}
}

function openGuziModal(guzi=null){
    const d=guzi||{cn:STATE.user?STATE.user.cn:'',ip:'',character:'',type:'吧唧',quantity:1,price:'',status:'正常',payment_status:'已交肾',payment_date:'',added_date:new Date().toISOString().split('T')[0],storage:'',notes:''};
    $('modalContainer').innerHTML=`
    <div class="modal-overlay" id="guziOverlay"><div class="modal"><h3>${guzi?'✏️ 编辑':'🌾 添加'}谷子</h3>
    <div class="form-grid">
      <div><label>圈名/CN</label><input id="gCN" value="${d.cn}"></div>
      <div><label>IP</label><input id="gIP" value="${d.ip}"></div>
      <div><label>角色</label><input id="gChar" value="${d.character}"></div>
      <div><label>种类</label><select id="gType">${['吧唧','立牌','挂件','色纸','海报','明信片','亚克力砖','毛绒','其他'].map(t=>`<option ${d.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div><label>数量</label><input type="number" id="gQty" value="${d.quantity}" min="1"></div>
      <div><label>价格</label><input type="number" id="gPrice" value="${d.price}" step="0.01"></div>
      <div><label>状态</label><select id="gStatus"><option>正常</option><option>待交肾</option><option>已交肾</option></select></div>
      <div><label>交肾状态</label><select id="gPayStatus"><option>已交肾</option><option>未交肾</option></select></div>
      <div><label>交肾日期</label><input type="date" id="gPayDate" value="${d.payment_date||''}"></div>
      <div><label>添加日期</label><input type="date" id="gAddedDate" value="${d.added_date}"></div>
      <div class="full-width"><label>收纳位置</label><input id="gStorage" value="${d.storage}"></div>
      <div class="full-width"><label>备注</label><textarea id="gNotes">${d.notes}</textarea></div>
    </div>
    <input type="hidden" id="gEditId" value="${guzi?.id||''}">
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline btn-sm" onclick="closeModal('guziOverlay')">取消</button>
      ${guzi?`<button class="btn btn-danger btn-sm" onclick="deleteGuzi()">删除</button>`:''}
      <button class="btn btn-primary" onclick="saveGuzi()">保存</button>
    </div></div></div>`;
    $('gStatus').value=d.status;$('gPayStatus').value=d.payment_status;
}
async function saveGuzi(){
    const guzi={
        cn:$('gCN').value.trim(),ip:$('gIP').value.trim(),character:$('gChar').value.trim(),
        type:$('gType').value,quantity:parseInt($('gQty').value)||1,price:parseFloat($('gPrice').value)||0,
        status:$('gStatus').value,payment_status:$('gPayStatus').value,payment_date:$('gPayDate').value||null,
        added_date:$('gAddedDate').value,storage:$('gStorage').value.trim(),notes:$('gNotes').value.trim()
    };
    if(!guzi.cn||!guzi.ip)return toast('请填写圈名和IP',false);
    const editId=$('gEditId').value;
    if(STATE.mode==='personal'){
        if(editId){
            const idx=STATE.personal.findIndex(g=>g.id===editId);
            if(idx>=0) STATE.personal[idx]={...STATE.personal[idx],...guzi,id:editId};
        }else{
            guzi.id='p_'+Date.now();STATE.personal.push(guzi);
        }
        localStorage.setItem('guzi_personal',JSON.stringify(STATE.personal));
        STATE.list=[...STATE.personal];
    }else{
        try{
            if(editId) await api(`/groups/${STATE.groupId}/guzi/${editId}`,'PUT',guzi);
            else await api(`/groups/${STATE.groupId}/guzi`,'POST',guzi);
            await loadGroupGuzi();
        }catch(e){return toast(e.message,false)}
    }
    closeModal('guziOverlay');applyFilters();updateStats();updateChips();toast('保存成功');
}
async function deleteGuzi(){
    if(!confirm('确定删除？'))return;
    const id=$('gEditId').value;
    if(STATE.mode==='personal'){
        STATE.personal=STATE.personal.filter(g=>g.id!==id);
        localStorage.setItem('guzi_personal',JSON.stringify(STATE.personal));
        STATE.list=[...STATE.personal];
    }else{
        try{await api(`/groups/${STATE.groupId}/guzi/${id}`,'DELETE');await loadGroupGuzi()}catch(e){return toast(e.message,false)}
    }
    closeModal('guziOverlay');applyFilters();updateStats();updateChips();toast('已删除');
}
function closeModal(id){const el=$(id);if(el)el.remove()}

// ==================== 筛选与渲染 ====================
function setStatus(s,el){
    document.querySelectorAll('#statusFilters .filter-chip').forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    STATE.filters.status=s;applyFilters();
}
function clearFilters(){
    STATE.filters={search:'',ip:'all',char:'all',type:'all',status:'all',display:'all'};
    $('searchInput').value='';$('displayMode').value='all';
    document.querySelectorAll('#statusFilters .filter-chip').forEach(c=>c.classList.remove('active'));
    document.querySelector('#statusFilters [data-status="all"]')?.classList.add('active');
    applyFilters();updateChips();
}
function applyFilters(){
    let list=STATE.mode==='personal'?[...STATE.personal]:[...STATE.list];
    // 计算提醒/掉落
    list=list.map(g=>{
        const now=new Date().toISOString().split('T')[0];
        const added=g.added_date;
        const daysAdded=added?daysBetween(added,now):0;
        const daysMonth=added?daysBetween(firstOfMonth(added).toISOString().split('T')[0],now):0;
        let isDrop=false,needRemind=false,remindType='';
        if(STATE.mode==='personal'&&daysAdded>100&&g.status!=='掉落'){needRemind=true;remindType='dry'}
        if(STATE.mode==='group'){
            if(g.payment_status==='未交肾'&&g.payment_date&&daysBetween(g.payment_date,now)>14){isDrop=true}
            if(daysMonth>210&&!isDrop){isDrop=true}
            if(daysMonth>180&&!isDrop&&g.status!=='掉落'){needRemind=true;remindType='clear'}
        }
        return{...g,_isDrop:isDrop,_needRemind:needRemind,_remindType:remindType};
    });
    // 状态筛选
    if(STATE.filters.status==='掉落') list=list.filter(g=>g._isDrop||g.status==='掉落');
    else if(STATE.filters.status!=='all') list=list.filter(g=>g.status===STATE.filters.status&&!g._isDrop);
    // 搜索
    const s=$('searchInput')?.value?.toLowerCase()||'';
    if(s) list=list.filter(g=>Object.values(g).some(v=>String(v).toLowerCase().includes(s)));
    // IP/角色/种类筛选
    if(STATE.filters.ip!=='all') list=list.filter(g=>g.ip===STATE.filters.ip);
    if(STATE.filters.char!=='all') list=list.filter(g=>g.character===STATE.filters.char);
    if(STATE.filters.type!=='all') list=list.filter(g=>g.type===STATE.filters.type);
    renderWaterfall(list);updateStats(list);
}
function renderWaterfall(list){
    const mode=$('displayMode').value;
    let html='';
    if(mode==='by-ip'){
        const grp={};list.forEach(g=>{const k=g.ip||'未知';if(!grp[k])grp[k]=[];grp[k].push(g)});
        for(const[k,gs]of Object.entries(grp))html+=`<div style="column-span:all;margin:12px 0;font-weight:700">🎯 ${k}</div>`+gs.map(card).join('');
    }else if(mode==='by-type'){
        const grp={};list.forEach(g=>{const k=g.type||'未知';if(!grp[k])grp[k]=[];grp[k].push(g)});
        for(const[k,gs]of Object.entries(grp))html+=`<div style="column-span:all;margin:12px 0;font-weight:700">🏷️ ${k}</div>`+gs.map(card).join('');
    }else html=list.map(card).join('');
    $('waterfall').innerHTML=html;
    $('empty').style.display=list.length?'none':'block';
}
function card(g){
    const isDrop=g._isDrop||g.status==='掉落';
    let tag='';
    if(g._needRemind&&!isDrop)tag=`<span style="position:absolute;top:8px;right:8px;font-size:0.7em;background:#FFF0D0;padding:2px 6px;border-radius:8px">${g._remindType==='dry'?'🧴换干燥剂':'📦清货'}</span>`;
    if(isDrop)tag='<span style="position:absolute;top:8px;right:8px;font-size:0.7em;background:#F5F5F5;padding:2px 6px;border-radius:8px">💧掉落</span>';
    return `<div class="guzi-card ${isDrop?'drop':''}" onclick="openGuziModal(${JSON.stringify(g).replace(/"/g,'&quot;')})">
      ${tag}
      <div class="card-header"><span class="card-cn">👤 ${g.cn||'?'}</span><span class="card-ip">${g.ip||'?'}</span></div>
      <div style="font-size:0.8em;color:var(--text-light)">${g.character||''} ${g.type||''} x${g.quantity||1} ¥${g.price||0}</div>
      <div><span class="badge ${g.status==='掉落'?'badge-drop':g.status==='待交肾'?'badge-warning':'badge-success'}">${g.status||'正常'}</span></div>
      ${g.storage?`<div style="font-size:0.75em">📍 ${g.storage}</div>`:''}
      <div class="card-footer"><span>📅 ${fmtDate(g.added_date)}</span></div>
    </div>`;
}
function updateStats(list=[]){$('stats').innerHTML=`总计: <strong>${list.length}</strong>`}
function updateChips(){
    const all=STATE.mode==='personal'?STATE.personal:STATE.list;
    const ips=[...new Set(all.map(g=>g.ip).filter(Boolean))];
    $('ipFilters').innerHTML='<span class="filter-chip active" data-ip="all" onclick="setChip(\'ip\',\'all\',this)">全部</span>'+ips.map(ip=>`<span class="filter-chip" data-ip="${ip}" onclick="setChip('ip','${ip}',this)">${ip}</span>`).join('');
    const chars=[...new Set(all.map(g=>g.character).filter(Boolean))];
    $('charFilters').innerHTML='<span class="filter-chip active" data-char="all" onclick="setChip(\'char\',\'all\',this)">全部</span>'+chars.map(c=>`<span class="filter-chip" data-char="${c}" onclick="setChip('char','${c}',this)">${c}</span>`).join('');
    const types=[...new Set(all.map(g=>g.type).filter(Boolean))];
    $('typeFilters').innerHTML='<span class="filter-chip active" data-type="all" onclick="setChip(\'type\',\'all\',this)">全部</span>'+types.map(t=>`<span class="filter-chip" data-type="${t}" onclick="setChip('type','${t}',this)">${t}</span>`).join('');
}
function setChip(cat,val,el){
    const map={ip:'ipFilters',char:'charFilters',type:'typeFilters'};
    document.querySelectorAll(`#${map[cat]} .filter-chip`).forEach(c=>c.classList.remove('active'));
    el.classList.add('active');
    STATE.filters[cat]=val;applyFilters();
}

// ==================== AI 对话 ====================
function toggleAI(){$('aiPanel').classList.toggle('collapsed');$('aiIcon').textContent=$('aiPanel').classList.contains('collapsed')?'▲':'▼'}
function sendAI(){
    const msg=$('aiInput').value.trim();if(!msg)return;
    $('aiMsgs').innerHTML+=`<div class="ai-msg user">${msg}</div>`;
    const parsed=parseAI(msg);
    if(parsed){
        STATE.aiPending=parsed;
        $('aiMsgs').innerHTML+=`<div class="ai-msg bot">✅ 识别：${parsed.cn} ${parsed.ip} ${parsed.character} ${parsed.type} x${parsed.quantity}<br><button class="btn btn-primary btn-sm" onclick="confirmAI()">确认导入</button></div>`;
    }else{
        $('aiMsgs').innerHTML+=`<div class="ai-msg bot">未能识别，请重试</div>`;
    }
    $('aiInput').value='';$('aiMsgs').scrollTop=$('aiMsgs').scrollHeight;
}
function parseAI(text){
    const r={cn:'',ip:'',character:'',type:'吧唧',quantity:1,price:0,status:'正常',payment_status:'已交肾',payment_date:'',added_date:new Date().toISOString().split('T')[0],storage:'',notes:''};
    const cnM=text.match(/CN\s*[:：]?\s*(\S+)/i)||text.match(/^(\S{1,6})[\s，,]/);if(cnM)r.cn=cnM[1];
    const ipM=text.match(/(原神|明日方舟|崩坏|星穹铁道|光与夜|恋与|王者荣耀|阴阳师|FGO|碧蓝航线|少女前线|咒术回战|鬼灭之刃|进击的巨人|间谍过家家|孤独摇滚|蓝色监狱|排球少年|文豪野犬|柯南|海贼王|火影忍者|死神|银魂|赛马娘|公主连结|未定事件簿|恋与深空|绝区零|鸣潮|无限暖暖|闪耀暖暖)/i);if(ipM)r.ip=ipM[0];
    const chM=text.match(/(钟离|达达利亚|散兵|万叶|神里绫华|雷电将军|纳西妲|芙宁娜|那维莱特|艾尔海森|卡维|提纳里|赛诺|妮露|迪希雅|流浪者|林尼|琳妮特|菲米尼|阿蕾奇诺|克洛琳德|希格雯|荧|空|派蒙|温迪|琴|迪卢克|可莉|七七|刻晴|甘雨|魈|胡桃|优菈|神里绫人|八重神子|夜兰|白术)/i);if(chM)r.character=chM[0];
    const tyM=text.match(/(吧唧|立牌|挂件|色纸|海报|明信片|亚克力砖|亚克力|毛绒|抱枕)/i);if(tyM)r.type=tyM[1];
    const qM=text.match(/(\d+)\s*(个|枚|张|件|只)/);if(qM)r.quantity=parseInt(qM[1]);
    const pM=text.match(/(\d+(?:\.\d+)?)\s*(元|块|r|¥)/i);if(pM)r.price=parseFloat(pM[1]);
    if(r.cn||r.ip)return r;
    return null;
}
function confirmAI(){
    if(!STATE.aiPending)return;
    const d=STATE.aiPending;d.id='p_'+Date.now();
    if(STATE.mode==='personal'){
        STATE.personal.push(d);localStorage.setItem('guzi_personal',JSON.stringify(STATE.personal));STATE.list=[...STATE.personal];
    }else{
        api(`/groups/${STATE.groupId}/guzi`,'POST',d).then(()=>loadGroupGuzi());
    }
    STATE.aiPending=null;applyFilters();updateStats();updateChips();toast('导入成功');
}

// ==================== Excel / 图片 ====================
function handleExcel(e){
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(ev){
        const lines=ev.target.result.split('\n').filter(l=>l.trim());
        if(lines.length<2)return toast('文件内容不足',false);
        let cnt=0;
        for(let i=1;i<lines.length;i++){
            const cols=lines[i].split(/[,\t]/);
            if(cols.length<3)continue;
            const g={cn:cols[0]?.trim()||'',ip:cols[1]?.trim()||'',character:cols[2]?.trim()||'',type:cols[3]?.trim()||'吧唧',quantity:parseInt(cols[4])||1,price:parseFloat(cols[5])||0,status:'正常',payment_status:'已交肾',added_date:new Date().toISOString().split('T')[0],storage:cols[7]?.trim()||'',notes:cols[8]?.trim()||'',id:'p_'+Date.now()+'_'+i};
            if(!g.cn&&!g.ip)continue;
            if(STATE.mode==='personal')STATE.personal.push(g);
            else api(`/groups/${STATE.groupId}/guzi`,'POST',g);
            cnt++;
        }
        if(STATE.mode==='personal'){localStorage.setItem('guzi_personal',JSON.stringify(STATE.personal));STATE.list=[...STATE.personal];}
        else setTimeout(()=>loadGroupGuzi().then(()=>{applyFilters();updateStats();updateChips()}),1500);
        applyFilters();updateStats();updateChips();toast(`导入 ${cnt} 条`);
    };
    reader.readAsText(file);e.target.value='';
}
function handleImage(e){toast('图片已接收（模拟识别），实际使用请接入OCR',false);openGuziModal();e.target.value=''}

// ==================== 初始化 ====================
async function init(){
    STATE.list=[...STATE.personal];
    const token=localStorage.getItem('token');
    if(token){
        try{
            const data=await api('/auth/me');
            STATE.user=data.user;
            STATE.groupId=data.user.groupId||null;
            await loadGroups();
            if(STATE.groupId)await loadGroupGuzi();
            updateUI();
        }catch(e){localStorage.removeItem('token')}
    }
    switchMode('personal');
}
init();
</script>
